id: example-web-app
name: Example Web App
summary: >
  A demonstration web service running as a Docker container on the fictional
  hydra host. Exists only to show how a service entity is shaped and how the
  generators, rules, and drift loop treat it.
service_type: vocab:service_types:docker_container
lifecycle: vocab:service_lifecycles:running
host: server:hydra
deployment_path: /opt/apps/example-web-app
port: 8080
health_endpoint: https://app.example.com/healthz
systemd_unit: null
network_binding: lan
auth:
  mechanism: none
  notes: Public read-only demo endpoint.
owned_by: project:example-web-platform
depends_on: []
container_name: example-web-app
restartable: true
tier: apps
expected_state: running_required
last_health_check: null
last_health_status: vocab:health_statuses:ok
failure_modes:
  - container exits if the configured port is already bound
resource_budget_ram_mb: 256
external_url: https://app.example.com
portal_visible: true
portal_label: Example Web App
auth_gated: false
created_at: 2026-01-01T00:00:00Z
updated_at: 2026-01-01T00:00:00Z
