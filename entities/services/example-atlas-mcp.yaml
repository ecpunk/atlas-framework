id: example-atlas-mcp
name: Example Atlas MCP
summary: >
  Reference deployment of the Atlas MCP server exposing the canonical store to
  agents and operators over HTTP. Demonstrates an mcp_http service entity.
service_type: vocab:service_types:mcp_http
lifecycle: vocab:service_lifecycles:running
host: server:hydra
deployment_path: /opt/atlas-framework/tools/mcp_server.py
port: 8105
health_endpoint: https://atlas-mcp.example.com/mcp
systemd_unit: atlas-mcp.service
network_binding: lan
auth:
  mechanism: api_key
  header: X-API-Key
  env_var: ATLAS_MCP_API_KEY
  key_file: secrets/api_key.txt
  notes: Localhost bypasses the auth check; remote clients must supply the header.
owned_by: project:atlas
depends_on: []
tier: ops
last_health_check: null
last_health_status: vocab:health_statuses:ok
failure_modes:
  - store load fails if entities contain schema validation errors
  - port conflict if a leftover process is bound to 8105
resource_budget_ram_mb: 256
portal_visible: false
created_at: 2026-01-01T00:00:00Z
updated_at: 2026-01-01T00:00:00Z
