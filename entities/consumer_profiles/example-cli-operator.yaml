id: example-cli-operator
display_name: Example CLI Operator (direct)
input_modality: vocab:consumer_input_modalities:slash_command
auth_principal: desktop-session:operator-cli
principal_class: operator_direct
allowed_action_tiers:
  - vocab:action_tiers:read_only
  - vocab:action_tiers:reversible
  - vocab:action_tiers:new_surface
  - vocab:action_tiers:irreversible
autopilot_eligibility:
  read_only: true
  reversible: true
  new_surface: true
  irreversible: true
confirm_channel: vocab:consumer_confirm_channels:copilot_blocking_return
response_shape: vocab:consumer_response_shapes:one_line_summary
session_entity_profile: vocab:session_entity_profiles:execution_focused
tool_scope:
  - '*'
explainability_payload:
  include_fields:
    - confirm_requirement
    - tool_scope_applied
  default_verbosity: concise
  allow_operator_expand: true
notes: >
  Operator-direct trust tier: a human driving hands-on from the CLI accepts risk,
  so every tier is autopilot-eligible (typing the command is the confirmation).
created_at: 2026-01-01T00:00:00Z
updated_at: 2026-01-01T00:00:00Z
