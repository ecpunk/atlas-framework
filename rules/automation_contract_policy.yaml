version: 1

# Automation contract policy (EXAMPLE).
#
# The automation_contract_check generator reconciles the systemd timers/services
# an operator actually runs against this declared contract. Each scheduled
# automation should either write durable state (state_required) or be explicitly
# declared stateless (no_state_allowed). Candidate-for-retirement units are
# flagged so cleanup surfaces in the drift loop instead of rotting silently.
#
# Replace the example timers below with your own automation inventory.

defaults:
  contract_class: state_required
  retirement_status: active
  retirement_note: ""
  superseded_by: ""
  state_path_patterns:
    - automations/state
    - state.json
    - state.csv
    - state.log
    - index_meta.json

timers:
  example-drift.timer:
    contract_class: state_required
  example-probe.timer:
    contract_class: state_required
  example-smoke.timer:
    contract_class: no_state_allowed
  example-backup.timer:
    contract_class: state_required
    state_path_patterns:
      - automations/scripts/logs/example_backup.log
      - example_backup.log
  example-legacy-monitor.timer:
    contract_class: state_required
    retirement_status: candidate
    retirement_note: "Superseded by example-probe + alert-responder; keep only if unique checks remain."
    superseded_by: example-probe.timer
